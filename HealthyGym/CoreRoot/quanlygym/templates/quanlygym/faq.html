{% extends 'quanlygym/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-uppercase">Câu Hỏi Thường Gặp (FAQ)</h1>
        <p class="text-muted">Mọi giải đáp thắc mắc liên quan đến thẻ hội viên và chính sách HealthyGym</p>
    </div>

    <div class="accordion col-md-8 mx-auto shadow-sm" id="faqAccordion">
        {% for faq in faqs %}
        <div class="accordion-item">
            <h2 class="accordion-header" id="heading{{ faq.id }}">
                <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ faq.id }}">
                    ❓ {{ faq.question }}
                </button>
            </h2>
            <div id="collapse{{ faq.id }}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                <div class="accordion-body text-secondary">
                    {{ faq.answer }}
                </div>
            </div>
        </div>
        {% empty %}
        <div class="text-center py-4 text-muted">Đang cập nhật nội dung giải đáp.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
