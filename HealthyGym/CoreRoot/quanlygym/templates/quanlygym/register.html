{% extends 'quanlygym/base.html' %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0">Đăng Ký Hội Viên Mới</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100 mt-3">Hoàn tất Đăng ký</button>
                </form>
                <div class="text-center mt-3">
                    <small>Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập tại đây</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
